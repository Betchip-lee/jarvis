version: "3.9"
services:
  jarvis:
    build: .
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD","python","-c","print('ok')"]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
